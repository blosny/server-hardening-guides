version: "3.8"

services:
  # LOKI: Main log repository
  loki:
    image: grafana/loki:3.1.0
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - monitoring

  # PROMTAIL: Agent that sends logs to Loki
  promtail:
    image: grafana/promtail:3.1.0
    volumes:
      - /var/log:/var/log
      - ./promtail-config.yaml:/etc/promtail/config.yaml
    command: -config.file=/etc/promtail/config.yaml
    networks:
      - monitoring

  # GRAFANA: Visualization dashboard
  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set in your .env file}
    networks:
      - monitoring

networks:
  monitoring:
    driver: bridge
